<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Hub | Next-Gen Minecraft Mods</title>
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JSZip kütüphanesi (Gerçek Minecraft paketlerini anında oluşturmak için) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: rgba(22, 31, 48, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 100px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
            min-height: 100vh;
        }

        /* Header Neon Tasarım */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: -0.5px;
            cursor: pointer;
        }

        .logo i {
            color: var(--accent-green);
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        .logo span { color: var(--accent-green); }

        .header-icons {
            display: flex;
            gap: 16px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .header-btn:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Popover Paneller */
        .popover-panel {
            position: absolute;
            top: 55px;
            right: 0;
            background: #0f172a;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--card-border);
            width: 260px;
            padding: 18px;
            display: none;
            z-index: 200;
            font-size: 13px;
        }
        .popover-panel.active { display: block; }
        .popover-title {
            font-weight: 700;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .container {
            padding: 20px 16px;
            max-width: 850px;
            margin: 0 auto;
        }

        /* Modern Arama Kutusu */
        .search-box {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-size: 15px;
            color: #fff;
            font-weight: 500;
        }

        /* Neon Filtre Butonları */
        .categories-filter {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .categories-filter::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Modern Mod Kartı */
        .mod-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .mod-card:hover {
            transform: translateY(-3px);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .card-header { display: flex; gap: 16px; margin-bottom: 12px; }

        .mod-img-box {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 30px;
            color: #ffffff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .badges { display: flex; gap: 8px; margin-bottom: 6px; }
        .badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .badge-version {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        .mod-title { font-size: 18px; font-weight: 800; color: #fff; }
        .mod-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; }

        .mod-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .action-btns { display: flex; gap: 10px; }
        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .action-btn.liked { color: #ef4444; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); }
        .action-btn.saved { color: #f59e0b; background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.4); }

        .btn-download {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #000;
            padding: 14px; border-radius: 12px; font-weight: 800; font-size: 15px;
            cursor: pointer; border: none; width: 100%;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            transform: scale(1.01);
            filter: brightness(1.1);
        }

        /* Bottom Floating Bar */
        .bottom-nav {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 500px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            display: flex; justify-content: space-around;
            padding: 12px 0; border-radius: 25px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-secondary); font-size: 11px; gap: 4px; font-weight: 700; cursor: pointer;
            transition: all 0.3s;
        }

        .nav-item.active { color: var(--accent-green); }
        .nav-item i { font-size: 20px; }

        /* Kategori Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
        }
        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .category-card:hover { border-color: var(--accent-green); }
        .category-icon {
            width: 50px; height: 50px; border-radius: 14px; margin: 0 auto 10px auto;
            display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff;
        }

        #empty-msg { text-align: center; color: var(--text-secondary); padding: 50px 0; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchTab('home')">
            <i class="fa-solid fa-cube"></i>
            Bedrock<span>HUB</span>
        </div>
        <div class="header-icons">
            <div class="header-btn" id="notif-btn">
                <i class="fa-regular fa-bell"></i>
                <div id="notification-popover" class="popover-panel">
                    <div class="popover-title"><i class="fa-solid fa-bell"></i> Bildirimler</div>
                    <p style="color: var(--text-secondary);">Minecraft v1.21.30 Uyumlu Modlar Eklendi!</p>
                </div>
            </div>
            
            <div class="header-btn" id="profile-btn">
                <i class="fa-regular fa-user"></i>
                <div id="profile-popover" class="popover-panel">
                    <div class="popover-title"><i class="fa-solid fa-user"></i> Oyuncu Profili</div>
                    <p style="font-weight: 800; font-size: 15px;">Steve #128</p>
                    <p style="color: var(--text-secondary); margin-top: 6px;">İndirilen Modlar: <span id="user-total-downloads" style="color:var(--accent-green); font-weight:bold;">0</span></p>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Arama Kutusu -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary);"></i>
            <input type="text" id="searchInput" placeholder="Minecraft mod, eklenti veya harita ara..." onkeyup="filterMods()">
        </div>

        <!-- ANA SAYFA -->
        <div id="tab-home" class="tab-content active">
            <div class="categories-filter" id="filter-bar">
                <button class="cat-btn active" onclick="filterCategory('all', this)">Tümü</button>
                <button class="cat-btn" onclick="filterCategory('Survival', this)">Survival</button>
                <button class="cat-btn" onclick="filterCategory('Quality of Life', this)">Quality of Life</button>
                <button class="cat-btn" onclick="filterCategory('Utility', this)">Utility</button>
                <button class="cat-btn" onclick="filterCategory('Combat', this)">Combat</button>
            </div>
            
            <div id="empty-msg">Aradığın mod bulunamadı.</div>
            <div class="mod-list"></div>
        </div>

        <!-- KATEGORİLER -->
        <div id="tab-categories" class="tab-content">
            <h3 style="margin-bottom: 16px; font-size: 18px; font-weight: 800;">Kategoriler</h3>
            <div class="category-grid">
                <div class="category-card" onclick="selectCategoryFromGrid('Survival')">
                    <div class="category-icon" style="background: linear-gradient(135deg, #10b981, #047857);"><i class="fa-solid fa-gem"></i></div>
                    <h4>Survival</h4>
                </div>
                <div class="category-card" onclick="selectCategoryFromGrid('Quality of Life')">
                    <div class="category-icon" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                    <h4>Quality of Life</h4>
                </div>
                <div class="category-card" onclick="selectCategoryFromGrid('Utility')">
                    <div class="category-icon" style="background: linear-gradient(135deg, #f59e0b, #b45309);"><i class="fa-solid fa-wrench"></i></div>
                    <h4>Utility</h4>
                </div>
                <div class="category-card" onclick="selectCategoryFromGrid('Combat')">
                    <div class="category-icon" style="background: linear-gradient(135deg, #ef4444, #b91c1c);"><i class="fa-solid fa-shield-halved"></i></div>
                    <h4>Combat</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Alt Floating Navigasyon -->
    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
            <i class="fa-solid fa-house"></i> Ana Sayfa
        </div>
        <div class="nav-item" id="nav-categories" onclick="switchTab('categories')">
            <i class="fa-solid fa-layer-group"></i> Kategoriler
        </div>
        <div class="nav-item" id="nav-popular" onclick="switchTab('popular')">
            <i class="fa-solid fa-fire"></i> Popüler
        </div>
        <div class="nav-item" id="nav-saved" onclick="switchTab('saved')">
            <i class="fa-regular fa-bookmark"></i> Kaydedilenler
        </div>
    </nav>

    <script>
        // Mod Verileri
        const modsData = [
            { id: 'mod1', title: 'Vein Miner Pro', category: 'Survival', desc: 'Maden damarlarını ve dev ağaçları tek vuruşta kır! Eğilerek maden kazabilirsin.', downloads: 142, likes: 38, icon: 'fa-gem', bg: 'linear-gradient(135deg, #10b981, #059669)' },
            { id: 'mod2', title: 'Action & Stuff Animations', category: 'Quality of Life', desc: 'Minecraft Bedrock yürüyüş, koşma ve kılıç sallama animasyonlarını baştan yaratır.', downloads: 310, likes: 95, icon: 'fa-person-running', bg: 'linear-gradient(135deg, #8b5cf6, #6d28d9)' },
            { id: 'mod3', title: 'Dynamic Lighting', category: 'Utility', desc: 'Elinizde tuttuğunuz meşale ve parlayan eşyalar madenlerde etrafı otomatik aydınlatır.', downloads: 220, likes: 64, icon: 'fa-lightbulb', bg: 'linear-gradient(135deg, #f59e0b, #d97706)' },
            { id: 'mod4', title: 'Java Combat Addon', category: 'Combat', desc: 'Minecraft Java sürümündeki vuruş bekleme süresi (cooldown) ve süpürme vuruşunu getirir.', downloads: 189, likes: 52, icon: 'fa-shield-halved', bg: 'linear-gradient(135deg, #ef4444, #dc2626)' }
        ];

        let currentTab = 'home';
        let selectedCategory = 'all';

        window.onload = function() {
            setupPopovers();
            renderMods();
            updateUserProfile();
        };

        function setupPopovers() {
            document.getElementById('notif-btn').addEventListener('click', (e) => { e.stopPropagation(); togglePopover('notification-popover'); });
            document.getElementById('profile-btn').addEventListener('click', (e) => { e.stopPropagation(); togglePopover('profile-popover'); });
            document.addEventListener('click', () => { document.querySelectorAll('.popover-panel').forEach(p => p.classList.remove('active')); });
        }

        function togglePopover(id) {
            let p = document.getElementById(id);
            let active = p.classList.contains('active');
            document.querySelectorAll('.popover-panel').forEach(panel => panel.classList.remove('active'));
            if(!active) p.classList.add('active');
        }

        function renderMods() {
            let container = document.querySelector('.mod-list');
            container.innerHTML = '';

            let filtered = modsData.filter(mod => {
                let matchesCategory = (selectedCategory === 'all' || mod.category === selectedCategory);
                let matchesSearch = mod.title.toLowerCase().includes(document.getElementById('searchInput').value.toLowerCase());
                let isSaved = localStorage.getItem(mod.id + '_saved') === 'true';

                if(currentTab === 'saved') return isSaved && matchesSearch;
                return matchesCategory && matchesSearch;
            });

            if(currentTab === 'popular') {
                filtered.sort((a, b) => {
                    let dA = parseInt(localStorage.getItem(a.id + '_dl_count') || a.downloads);
                    let dB = parseInt(localStorage.getItem(b.id + '_dl_count') || b.downloads);
                    return dB - dA;
                });
            }

            if(filtered.length === 0) {
                document.getElementById('empty-msg').style.display = 'block';
            } else {
                document.getElementById('empty-msg').style.display = 'none';
            }

            filtered.forEach(mod => {
                let dlCount = localStorage.getItem(mod.id + '_dl_count') || mod.downloads;
                let likeCount = localStorage.getItem(mod.id + '_likes') || mod.likes;
                let isLiked = localStorage.getItem(mod.id + '_liked') === 'true';
                let isSaved = localStorage.getItem(mod.id + '_saved') === 'true';

                let card = document.createElement('div');
                card.className = 'mod-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="mod-img-box" style="background: ${mod.bg};">
                            <i class="fa-solid ${mod.icon}"></i>
                        </div>
                        <div>
                            <div class="badges">
                                <span class="badge">${mod.category}</span>
                                <span class="badge-version">v1.21+ Uyumlu</span>
                            </div>
                            <div class="mod-title">${mod.title}</div>
                        </div>
                    </div>
                    <div class="mod-desc">${mod.desc}</div>
                    <div class="mod-stats">
                        <span><i class="fa-solid fa-download"></i> <span id="dl-${mod.id}">${dlCount}</span> İndirme</span>
                        <div class="action-btns">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${mod.id}')">
                                <i class="fa-solid fa-heart"></i> <span id="like-${mod.id}">${likeCount}</span>
                            </button>
                            <button class="action-btn ${isSaved ? 'saved' : ''}" onclick="toggleBookmark('${mod.id}')">
                                <i class="fa-solid fa-bookmark"></i>
                            </button>
                        </div>
                    </div>
                    <button class="btn-download" onclick="downloadRealMcaddon('${mod.id}', '${mod.title}')">
                        <i class="fa-solid fa-play"></i> Minecraft'ta Aç (.mcaddon)
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // GERÇEK MINECRAFT BEDROCK PAKETİ OLUSTURMA VE İNDİRME (.mcaddon)
        function downloadRealMcaddon(id, title) {
            let userDownloaded = localStorage.getItem(id + '_user_downloaded') === 'true';

            if (!userDownloaded) {
                localStorage.setItem(id + '_user_downloaded', 'true');
                let mod = modsData.find(m => m.id === id);
                let currentDL = parseInt(localStorage.getItem(id + '_dl_count') || mod.downloads) + 1;
                localStorage.setItem(id + '_dl_count', currentDL);
            }

            renderMods();
            updateUserProfile();

            // JSZip ile gerçek manifest.json içeren mcaddon zip dosyası oluşturma
            const zip = new JSZip();
            
            // UUID'ler Minecraft için benzersiz kimliktir
            const uuidHeader = 'f81d4fae-7dec-11d0-a765-00a0c91e6bf6';
            const uuidModule = 'a2b3c4d5-e6f7-8901-2345-6789abcdef01';

            const manifest = {
                "format_version": 2,
                "header": {
                    "description": title + " Addon - BedrockHub",
                    "name": title,
                    "uuid": uuidHeader,
                    "version": [1, 0, 0],
                    "min_engine_version": [1, 21, 0]
                },
                "modules": [
                    {
                        "description": title + " Behavior Pack",
                        "type": "data",
                        "uuid": uuidModule,
                        "version": [1, 0, 0]
                    }
                ]
            };

            zip.file("manifest.json", JSON.stringify(manifest, null, 4));

            // .mcaddon olarak indirtme (Minecraft otomatik algılar)
            zip.generateAsync({type:"blob"}).then(function(content) {
                const fileName = title.replace(/[^a-zA-Z0-9]/g, "_") + ".mcaddon";
                const a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        }

        function toggleLike(id) {
            let isLiked = localStorage.getItem(id + '_liked') === 'true';
            let mod = modsData.find(m => m.id === id);
            let currentLikes = parseInt(localStorage.getItem(id + '_likes') || mod.likes);

            if(isLiked) {
                currentLikes--;
                localStorage.setItem(id + '_liked', 'false');
            } else {
                currentLikes++;
                localStorage.setItem(id + '_liked', 'true');
            }
            localStorage.setItem(id + '_likes', currentLikes);
            renderMods();
        }

        function toggleBookmark(id) {
            let isSaved = localStorage.getItem(id + '_saved') === 'true';
            localStorage.setItem(id + '_saved', !isSaved);
            renderMods();
        }

        function updateUserProfile() {
            let count = 0;
            modsData.forEach(m => {
                if(localStorage.getItem(m.id + '_user_downloaded') === 'true') count++;
            });
            document.getElementById('user-total-downloads').innerText = count;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            if(tab === 'categories') {
                document.getElementById('nav-categories').classList.add('active');
                document.getElementById('tab-categories').classList.add('active');
            } else {
                document.getElementById('nav-' + tab).classList.add('active');
                document.getElementById('tab-home').classList.add('active');
                renderMods();
            }
        }

        function filterCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMods();
        }

        function selectCategoryFromGrid(cat) {
            switchTab('home');
            let btn = Array.from(document.querySelectorAll('.cat-btn')).find(b => b.innerText.trim() === cat);
            if(btn) filterCategory(cat, btn);
        }

        function filterMods() { renderMods(); }
    </script>
</body>
</html>
