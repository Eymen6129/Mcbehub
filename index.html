<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Mod Hub</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #4CAF50;
        }
        .mod-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            margin: 15px auto;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Minecraft Bedrock Mod Hub</h1>
    <p>En iyi QoL ve Survival Addon'ları</p>

    <div class="mod-card">
        <h3>Mob Catcher Addon</h3>
        <p>Hayvanları ve köylüleri cebinde taşımanı sağlayan pratik eklenti.</p>
        <a href="#" class="btn">İndir (.mcaddon)</a>
    </div>

    <div class="mod-card">
        <h3>Vein Miner Pro</h3>
        <p>Madenleri ve ağaçları tek hamlede kır, doğrudan çantana gelsin.</p>
        <a href="#" class="btn">İndir (.mcaddon)</a>
    </div>
</body>
</html>
