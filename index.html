<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Bedrock — Türkiye'nin En İyi Sunucusu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
/* ============ RESET & BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05070d;
  --bg-2:#0a0e1a;
  --panel:rgba(15,20,35,0.6);
  --border:rgba(80,250,123,0.15);
  --emerald:#50fa7b;
  --emerald-2:#22c55e;
  --diamond:#38bdf8;
  --diamond-2:#00d4ff;
  --gold:#fbbf24;
  --redstone:#ef4444;
  --amethyst:#a78bfa;
  --text:#e6edf3;
  --text-dim:#8b95a8;
  --pixel:'Press Start 2P',monospace;
  --ui:'Inter',sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--ui);
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  cursor:none;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ============ CUSTOM CURSOR ============ */
.cursor{
  position:fixed;top:0;left:0;
  width:24px;height:24px;
  border:2px solid var(--emerald);
  pointer-events:none;
  z-index:99999;
  transform:translate(-50%,-50%);
  transition:width .2s,height .2s,background .2s,border-color .2s;
  box-shadow:0 0 12px rgba(80,250,123,.6),inset 0 0 12px rgba(80,250,123,.3);
  mix-blend-mode:screen;
}
.cursor-dot{
  position:fixed;top:0;left:0;
  width:4px;height:4px;
  background:var(--emerald);
  pointer-events:none;
  z-index:99999;
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px var(--emerald);
}
.cursor.hover{
  width:48px;height:48px;
  background:rgba(80,250,123,.15);
  border-color:var(--diamond);
  box-shadow:0 0 20px rgba(56,189,248,.8),inset 0 0 20px rgba(56,189,248,.4);
}
@media(max-width:900px){.cursor,.cursor-dot{display:none}body{cursor:auto}}

/* ============ LOADING SCREEN ============ */
#loader{
  position:fixed;inset:0;
  background:radial-gradient(ellipse at center,#0a0e1a 0%,#05070d 100%);
  z-index:99998;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity .6s,visibility .6s;
}
#loader.hide{opacity:0;visibility:hidden}
.loader-logo{
  font-family:var(--pixel);
  font-size:clamp(14px,3vw,28px);
  color:var(--emerald);
  text-shadow:0 0 20px rgba(80,250,123,.7),4px 4px 0 #000;
  margin-bottom:8px;
  letter-spacing:3px;
  animation:pulse 1.5s ease-in-out infinite;
}
.loader-sub{
  font-family:var(--pixel);
  font-size:8px;
  color:var(--text-dim);
  letter-spacing:4px;
  margin-bottom:40px;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.loader-bar{
  width:min(400px,80vw);
  height:32px;
  border:3px solid #1e2a44;
  background:#0a0e1a;
  position:relative;
  box-shadow:inset 0 0 20px rgba(0,0,0,.8),0 0 30px rgba(80,250,123,.2);
  padding:4px;
}
.loader-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--emerald),var(--diamond));
  box-shadow:0 0 20px var(--emerald);
  transition:width .2s;
  position:relative;
  overflow:hidden;
}
.loader-fill::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:shine 1s linear infinite;
}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.loader-text{
  font-family:var(--pixel);
  font-size:8px;
  color:var(--text-dim);
  margin-top:20px;
  letter-spacing:2px;
}

/* ============ BACKGROUND LAYERS ============ */
.bg-mesh{
  position:fixed;inset:0;
  z-index:-3;
  background:
    radial-gradient(circle at 20% 10%,rgba(80,250,123,.15),transparent 40%),
    radial-gradient(circle at 80% 20%,rgba(56,189,248,.12),transparent 40%),
    radial-gradient(circle at 50% 80%,rgba(167,139,250,.1),transparent 50%),
    radial-gradient(circle at 10% 90%,rgba(251,191,36,.08),transparent 40%);
  animation:meshMove 20s ease-in-out infinite alternate;
}
@keyframes meshMove{
  0%{transform:scale(1) translate(0,0)}
  100%{transform:scale(1.15) translate(-2%,2%)}
}
.grid-overlay{
  position:fixed;inset:0;
  z-index:-2;
  background-image:
    linear-gradient(rgba(80,250,123,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(80,250,123,.04) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);
}

/* ============ NAVBAR ============ */
nav{
  position:fixed;top:0;left:0;right:0;
  z-index:1000;
  padding:16px 40px;
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(5,7,13,.7);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(80,250,123,.1);
  transition:padding .3s;
}
nav.scrolled{padding:10px 40px;background:rgba(5,7,13,.9)}
.nav-logo{
  display:flex;align-items:center;gap:12px;
  font-family:var(--pixel);
  font-size:12px;
  color:#fff;
  letter-spacing:2px;
}
.logo-block{
  width:26px;height:26px;
  background:linear-gradient(135deg,#5cb85c 0%,#3d8a3d 100%);
  position:relative;
  box-shadow:0 0 20px rgba(80,250,123,.5),inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.2);
  animation:blockSpin 4s linear infinite;
  transform-style:preserve-3d;
}
@keyframes blockSpin{
  0%{transform:rotate(0)}
  25%{transform:rotate(90deg) scale(1.1)}
  50%{transform:rotate(180deg)}
  75%{transform:rotate(270deg) scale(1.1)}
  100%{transform:rotate(360deg)}
}
.nav-links{display:flex;gap:36px;align-items:center}
.nav-links a{
  color:var(--text-dim);
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
  position:relative;
  transition:color .3s;
  padding:8px 0;
}
.nav-links a::after{
  content:'';position:absolute;bottom:0;left:0;
  width:0;height:2px;
  background:linear-gradient(90deg,var(--emerald),var(--diamond));
  transition:width .3s;
  box-shadow:0 0 10px var(--emerald);
}
.nav-links a:hover{color:#fff}
.nav-links a:hover::after{width:100%}
.nav-cta{
  font-family:var(--ui);
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
  padding:12px 22px;
  background:linear-gradient(135deg,var(--emerald),var(--emerald-2));
  color:#05070d;
  border:none;border-radius:4px;
  cursor:none;
  transition:all .3s;
  text-transform:uppercase;
  box-shadow:0 0 20px rgba(80,250,123,.4);
}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(80,250,123,.6)}

/* ============ HERO ============ */
.hero{
  position:relative;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:120px 40px 80px;
  overflow:hidden;
}
.hero-inner{
  max-width:1300px;width:100%;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:60px;
  align-items:center;
  position:relative;z-index:10;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 16px;
  background:rgba(80,250,123,.08);
  border:1px solid rgba(80,250,123,.3);
  border-radius:100px;
  font-size:12px;
  font-weight:600;
  color:var(--emerald);
  letter-spacing:1px;
  margin-bottom:28px;
  animation:slideDown .8s .2s both;
}
.badge-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--emerald);
  box-shadow:0 0 12px var(--emerald);
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.hero h1{
  font-size:clamp(40px,6.5vw,88px);
  font-weight:900;
  line-height:1.02;
  letter-spacing:-.03em;
  margin-bottom:24px;
  animation:slideDown .8s .3s both;
}
.hero h1 .grad{
  background:linear-gradient(135deg,#50fa7b 0%,#38bdf8 50%,#a78bfa 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 30px rgba(80,250,123,.4));
  position:relative;
}
.hero h1 .pixel{
  font-family:var(--pixel);
  font-size:.5em;
  display:block;
  color:var(--text-dim);
  letter-spacing:6px;
  margin-bottom:12px;
  -webkit-text-fill-color:var(--text-dim);
}
.hero p.lead{
  font-size:18px;
  color:var(--text-dim);
  max-width:560px;
  margin-bottom:40px;
  line-height:1.7;
  animation:slideDown .8s .4s both;
}
.hero-buttons{
  display:flex;gap:16px;flex-wrap:wrap;
  animation:slideDown .8s .5s both;
}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:18px 32px;
  font-family:var(--ui);
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  text-decoration:none;
  border-radius:6px;
  cursor:none;
  transition:all .3s;
  position:relative;
  overflow:hidden;
  border:none;
}
.btn-primary{
  background:linear-gradient(135deg,var(--emerald) 0%,var(--emerald-2) 100%);
  color:#05070d;
  box-shadow:0 0 30px rgba(80,250,123,.5),0 8px 30px rgba(80,250,123,.3);
}
.btn-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 0 50px rgba(80,250,123,.7),0 15px 40px rgba(80,250,123,.4);
}
.btn-primary::before{
  content:'';position:absolute;top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transition:left .5s;
}
.btn-primary:hover::before{left:100%}
.btn-ghost{
  background:rgba(255,255,255,.03);
  color:#fff;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
}
.btn-ghost:hover{
  border-color:var(--emerald);
  background:rgba(80,250,123,.08);
  transform:translateY(-3px);
}

/* 3D floating blocks */
.hero-visual{
  position:relative;
  height:520px;
  animation:slideUp 1s .4s both;
}
.floating-block{
  position:absolute;
  width:120px;height:120px;
  transform-style:preserve-3d;
  animation:floatSpin 12s linear infinite;
}
.floating-block .face{
  position:absolute;
  width:120px;height:120px;
  border:2px solid rgba(0,0,0,.4);
  image-rendering:pixelated;
}
.block-1{top:10%;left:10%;animation-duration:14s}
.block-2{top:35%;right:5%;animation-duration:18s;animation-direction:reverse;width:90px;height:90px}
.block-2 .face{width:90px;height:90px}
.block-3{bottom:15%;left:20%;animation-duration:16s;width:100px;height:100px}
.block-3 .face{width:100px;height:100px}
.block-4{top:5%;right:30%;animation-duration:20s;animation-direction:reverse;width:70px;height:70px}
.block-4 .face{width:70px;height:70px}

/* Grass block faces */
.block-grass .top{background:linear-gradient(135deg,#7ec850,#5a9e2f);transform:rotateX(90deg) translateZ(60px);top:-60px;left:0;position:absolute;width:120px;height:120px}
.block-grass .bottom{background:#5a3a1a;transform:rotateX(-90deg) translateZ(60px);bottom:-60px;left:0;position:absolute;width:120px;height:120px}
.block-grass .front{background:linear-gradient(180deg,#7ec850 0%,#7ec850 30%,#5a3a1a 30%,#5a3a1a 100%);transform:translateZ(60px);position:absolute;width:120px;height:120px}
.block-grass .back{background:linear-gradient(180deg,#7ec850 0%,#7ec850 30%,#5a3a1a 30%,#5a3a1a 100%);transform:rotateY(180deg) translateZ(60px);position:absolute;width:120px;height:120px}
.block-grass .right{background:linear-gradient(180deg,#5a9e2f 0%,#5a9e2f 30%,#4a2e12 30%,#4a2e12 100%);transform:rotateY(90deg) translateZ(60px);position:absolute;width:120px;height:120px}
.block-grass .left{background:linear-gradient(180deg,#5a9e2f 0%,#5a9e2f 30%,#4a2e12 30%,#4a2e12 100%);transform:rotateY(-90deg) translateZ(60px);position:absolute;width:120px;height:120px}

.block-2 .top{transform:rotateX(90deg) translateZ(45px);top:-45px}
.block-2 .bottom{transform:rotateX(-90deg) translateZ(45px);bottom:-45px}
.block-2 .front{transform:translateZ(45px)}
.block-2 .back{transform:rotateY(180deg) translateZ(45px)}
.block-2 .right{transform:rotateY(90deg) translateZ(45px)}
.block-2 .left{transform:rotateY(-90deg) translateZ(45px)}

.block-3 .top{transform:rotateX(90deg) translateZ(50px);top:-50px}
.block-3 .bottom{transform:rotateX(-90deg) translateZ(50px);bottom:-50px}
.block-3 .front{transform:translateZ(50px)}
.block-3 .back{transform:rotateY(180deg) translateZ(50px)}
.block-3 .right{transform:rotateY(90deg) translateZ(50px)}
.block-3 .left{transform:rotateY(-90deg) translateZ(50px)}

.block-4 .top{transform:rotateX(90deg) translateZ(35px);top:-35px}
.block-4 .bottom{transform:rotateX(-90deg) translateZ(35px);bottom:-35px}
.block-4 .front{transform:translateZ(35px)}
.block-4 .back{transform:rotateY(180deg) translateZ(35px)}
.block-4 .right{transform:rotateY(90deg) translateZ(35px)}
.block-4 .left{transform:rotateY(-90deg) translateZ(35px)}

@keyframes floatSpin{
  0%{transform:rotateX(-20deg) rotateY(0deg) translateY(0)}
  50%{transform:rotateX(-20deg) rotateY(180deg) translateY(-25px)}
  100%{transform:rotateX(-20deg) rotateY(360deg) translateY(0)}
}

/* Diamond block (blue) */
.block-diamond .top,.block-diamond .bottom,.block-diamond .front,.block-diamond .back,.block-diamond .right,.block-diamond .left{
  background:linear-gradient(135deg,#38bdf8,#0284c7);
  box-shadow:inset 0 0 30px rgba(255,255,255,.3);
}
/* Gold block */
.block-gold .top,.block-gold .bottom,.block-gold .front,.block-gold .back,.block-gold .right,.block-gold .left{
  background:linear-gradient(135deg,#fbbf24,#d97706);
  box-shadow:inset 0 0 30px rgba(255,255,255,.3);
}
/* Amethyst */
.block-amethyst .top,.block-amethyst .bottom,.block-amethyst .front,.block-amethyst .back,.block-amethyst .right,.block-amethyst .left{
  background:linear-gradient(135deg,#a78bfa,#7c3aed);
  box-shadow:inset 0 0 30px rgba(255,255,255,.3);
}

@keyframes slideDown{
  from{opacity:0;transform:translateY(-30px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============ STATS BAR ============ */
.stats{
  position:relative;
  z-index:10;
  max-width:1300px;
  margin:0 auto;
  padding:60px 40px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}
.stat{
  text-align:center;
  padding:30px 20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  backdrop-filter:blur(20px);
  position:relative;
  overflow:hidden;
  transition:all .4s;
}
.stat::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--emerald),transparent);
  opacity:0;transition:opacity .4s;
}
.stat:hover{
  transform:translateY(-6px);
  border-color:rgba(80,250,123,.4);
  box-shadow:0 20px 40px rgba(80,250,123,.15);
}
.stat:hover::before{opacity:1}
.stat-num{
  font-family:var(--pixel);
  font-size:clamp(20px,3vw,32px);
  background:linear-gradient(135deg,var(--emerald),var(--diamond));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:12px;
  display:block;
}
.stat-label{
  font-size:11px;
  color:var(--text-dim);
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:600;
}

/* ============ SECTIONS ============ */
section.content{
  padding:120px 40px;
  position:relative;
  max-width:1300px;
  margin:0 auto;
}
.section-head{
  text-align:center;
  margin-bottom:80px;
}
.section-tag{
  font-family:var(--pixel);
  font-size:10px;
  color:var(--emerald);
  letter-spacing:4px;
  margin-bottom:20px;
  display:inline-block;
  padding:8px 18px;
  background:rgba(80,250,123,.06);
  border:1px solid rgba(80,250,123,.2);
  border-radius:100px;
}
.section-title{
  font-size:clamp(32px,5vw,56px);
  font-weight:900;
  letter-spacing:-.02em;
  line-height:1.1;
  margin-bottom:20px;
}
.section-title .grad{
  background:linear-gradient(135deg,var(--emerald),var(--diamond));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.section-sub{
  font-size:17px;
  color:var(--text-dim);
  max-width:600px;
  margin:0 auto;
}

/* ============ FEATURES ============ */
.features-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:24px;
}
.feature{
  padding:36px 30px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  backdrop-filter:blur(20px);
  position:relative;
  overflow:hidden;
  transition:all .4s cubic-bezier(.2,.8,.2,1);
  opacity:0;
  transform:translateY(30px);
}
.feature.reveal{opacity:1;transform:translateY(0)}
.feature::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(80,250,123,.15),transparent 40%);
  opacity:0;transition:opacity .4s;
  pointer-events:none;
}
.feature:hover::before{opacity:1}
.feature:hover{
  transform:translateY(-8px);
  border-color:rgba(80,250,123,.4);
  box-shadow:0 30px 60px rgba(0,0,0,.4),0 0 40px rgba(80,250,123,.15);
}
.feature-icon{
  width:60px;height:60px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  background:linear-gradient(135deg,rgba(80,250,123,.15),rgba(56,189,248,.15));
  border:1px solid rgba(80,250,123,.3);
  border-radius:12px;
  margin-bottom:24px;
  transition:all .3s;
}
.feature:hover .feature-icon{
  transform:scale(1.1) rotate(-5deg);
  box-shadow:0 0 30px rgba(80,250,123,.4);
}
.feature-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:12px;
  letter-spacing:-.01em;
}
.feature-desc{
  font-size:14px;
  color:var(--text-dim);
  line-height:1.7;
}

/* ============ GAMEMODES ============ */
.modes-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:24px;
}
.mode{
  position:relative;
  height:340px;
  border-radius:20px;
  overflow:hidden;
  cursor:none;
  border:1px solid var(--border);
  transition:all .5s cubic-bezier(.2,.8,.2,1);
  opacity:0;
  transform:translateY(30px);
}
.mode.reveal{opacity:1;transform:translateY(0)}
.mode-bg{
  position:absolute;inset:0;
  transition:transform .6s;
  background-size:cover;
  background-position:center;
}
.mode:hover .mode-bg{transform:scale(1.08)}
.mode-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 20%,rgba(5,7,13,.95) 100%);
}
.mode-content{
  position:absolute;bottom:0;left:0;right:0;
  padding:36px 30px;
  z-index:2;
}
.mode-num{
  font-family:var(--pixel);
  font-size:10px;
  color:var(--emerald);
  letter-spacing:3px;
  margin-bottom:12px;
}
.mode-title{
  font-size:28px;
  font-weight:900;
  margin-bottom:10px;
  letter-spacing:-.01em;
}
.mode-desc{
  font-size:14px;
  color:var(--text-dim);
  margin-bottom:20px;
}
.mode-tag{
  display:inline-block;
  padding:6px 14px;
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  border-radius:100px;
  background:rgba(80,250,123,.15);
  color:var(--emerald);
  border:1px solid rgba(80,250,123,.3);
}
.mode:hover{
  transform:translateY(-10px) scale(1.01);
  border-color:rgba(80,250,123,.5);
  box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 60px rgba(80,250,123,.2);
}

/* Mode backgrounds */
.mode-survival .mode-bg{
  background:
    radial-gradient(circle at 30% 30%,rgba(80,250,123,.3),transparent 60%),
    linear-gradient(135deg,#0a3a1a,#1a5a2a);
}
