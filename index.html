<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Pro | Mcpe Mods Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0b10;
            --card-bg: rgba(20, 22, 36, 0.8);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.4);
            --text-main: #ffffff;
            --text-muted: #8e9aaf;
            --success: #2ed573;
            --warning: #ffa502;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            padding-bottom: 110px; min-height: 100vh; overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 71, 87, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 90% 80%, rgba(46, 213, 115, 0.08) 0%, transparent 50%);
        }

        /* HEADER & BİLDİRİM ZİLİ */
        header {
            background: rgba(10, 11, 16, 0.9); backdrop-filter: blur(20px);
            padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .logo i { color: var(--accent-primary); filter: drop-shadow(0 0 10px var(--accent-glow)); }
        
        .header-icons { display: flex; gap: 10px; }
        .header-btn {
            background: var(--card-bg); border: 1px solid var(--card-border);
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; color: var(--text-main);
        }
        .header-btn:active { transform: scale(0.92); }
        .header-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); box-shadow: 0 5px 15px var(--accent-glow); }
        
        .badge-dot {
            position: absolute; top: 10px; right: 10px; width: 10px; height: 10px;
            background: var(--accent-primary); border-radius: 50%; border: 2px solid var(--bg-main);
            box-shadow: 0 0 10px var(--accent-primary);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 71, 87, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }

        /* SÜRPRİZ MOD BUTONU BANNERI */
        .random-banner {
            background: linear-gradient(135deg, rgba(255,71,87,0.2) 0%, rgba(20,22,36,0.9) 100%);
            border: 1px dashed rgba(255, 71, 87, 0.4); border-radius: 20px; padding: 18px 24px;
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
            cursor: pointer; transition: 0.3s;
        }
        .random-banner:hover { border-color: var(--accent-primary); background: rgba(255,71,87,0.15); box-shadow: 0 10px 25px var(--accent-glow); }
        .random-btn { background: var(--accent-primary); color: #fff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 8px; }

        /* ARAMA VE KATEGORİLER */
        .controls-wrapper { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-box {
            flex: 1; min-width: 240px; background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--accent-primary); box-shadow: 0 0 15px rgba(255, 71, 87, 0.15); }
        .search-box input { background: transparent; border: none; color: #fff; font-size: 15px; width: 100%; outline: none; }
        
        .categories-filter { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; margin-bottom: 20px; }
        .cat-btn {
            background: var(--card-bg); color: var(--text-muted); padding: 10px 20px; border-radius: 30px;
            font-size: 13px; font-weight: 700; border: 1px solid var(--card-border); cursor: pointer; white-space: nowrap; transition: 0.3s;
        }
        .cat-btn.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); box-shadow: 0 5px 15px var(--accent-glow); transform: translateY(-2px); }

        /* MOD GRID VE KARTLAR */
        .mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .mod-card {
            background: var(--card-bg); backdrop-filter: blur(10px); border-radius: 22px;
            padding: 20px; border: 1px solid var(--card-border); cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); animation: fadeUp 0.4s ease-out forwards; opacity: 0;
            position: relative; overflow: hidden;
        }
        .mod-card:hover { transform: translateY(-6px) scale(1.01); border-color: rgba(255, 71, 87, 0.5); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        
        .card-header { display: flex; gap: 16px; margin-bottom: 12px; }
        .mod-img { width: 65px; height: 65px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; flex-shrink: 0; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .mod-title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .badge { background: rgba(255, 71, 87, 0.15); color: var(--accent-primary); font-size: 11px; padding: 4px 12px; border-radius: 12px; font-weight: bold; border: 1px solid rgba(255, 71, 87, 0.3); }
        .mod-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .mod-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--card-border); padding-top: 14px; }
        .stat-item { font-size: 13px; color: var(--text-muted); font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .btn-view { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: #fff; padding: 8px 18px; border-radius: 12px; font-weight: 700; font-size: 13px; transition: 0.3s; }
        .mod-card:hover .btn-view { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; box-shadow: 0 0 15px var(--accent-glow); }

        /* MODAL (SÜRÜM SEÇİMLİ DETAY EKRANI) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 1000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; padding: 20px;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: #12131c; border: 1px solid var(--card-border); border-radius: 26px;
            width: 100%; max-width: 490px; padding: 28px; position: relative;
            transform: translateY(30px) scale(0.95); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        .close-modal { position: absolute; top: 20px; right: 20px; background: var(--card-bg); border: none; width: 36px; height: 36px; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .close-modal:hover { background: var(--accent-primary); transform: rotate(90deg); }
        
        .modal-header-info { display: flex; gap: 18px; margin-bottom: 20px; align-items: center; }
        .modal-icon { width: 75px; height: 75px; border-radius: 20px; font-size: 36px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-title { font-size: 22px; font-weight: 900; margin-bottom: 4px; }

        /* SÜRÜM SEÇİCİ */
        .version-selector-box {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 12px 16px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .version-label { font-size: 13px; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .version-dropdown {
            background: #181a29; color: var(--accent-primary); border: 1px solid var(--accent-primary);
            padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 13px; outline: none; cursor: pointer;
        }

        /* YILDIZ DEĞERLENDİRME */
        .rating-box { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; color: #ffa502; font-size: 16px; }
        .rating-stars i { cursor: pointer; transition: 0.2s; }
        .rating-stars i:hover { transform: scale(1.2); }

        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .btn-download-direct {
            flex: 1; background: var(--accent-primary); color: #fff; border: none;
            padding: 16px; border-radius: 16px; font-weight: 800; font-size: 15px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 8px 25px var(--accent-glow); transition: 0.3s; text-decoration: none;
        }
        .btn-download-direct:hover { transform: translateY(-3px); box-shadow: 0 12px 30px var(--accent-glow); }
        .btn-action-icon {
            width: 52px; background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; transition: 0.3s;
        }
        .btn-action-icon.liked { color: #ff4757; background: rgba(255,71,87,0.15); border-color: #ff4757; box-shadow: 0 0 15px rgba(255,71,87,0.3); }
        .btn-action-icon.saved { color: #ffa502; background: rgba(255,165,2,0.15); border-color: #ffa502; box-shadow: 0 0 15px rgba(255,165,2,0.3); }

        /* TOAST BİLDİRİM */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: rgba(18, 19, 28, 0.95); backdrop-filter: blur(10px); border-left: 4px solid var(--accent-primary);
            color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards, fadeOut 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 2.5s;
        }
        .toast.success { border-color: var(--success); }
        .toast.success i { color: var(--success); }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        /* ALT NAVIGASYON */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px;
            background: rgba(18,19,28,0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-around;
            padding: 14px 0; border-radius: 30px; border: 1px solid var(--card-border); box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 12px; font-weight: 700; gap: 6px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--accent-primary); transform: translateY(-3px); }
        .nav-item i { font-size: 22px; transition: 0.3s; }
        .nav-item.active i { filter: drop-shadow(0 0 10px var(--accent-glow)); }
    </style>
</head>
<body>

    <!-- TOAST ALANI -->
    <div id="toast-container"></div>

    <!-- HEADER -->
    <header>
        <div class="logo" onclick="switchTab('home')"><i class="fa-solid fa-cubes"></i> BedrockPro</div>
        <div class="header-icons">
            <div class="header-btn" onclick="openHelpModal()"><i class="fa-solid fa-circle-question"></i></div>
            <div class="header-btn" onclick="openInfoModal('notifications')">
                <i class="fa-solid fa-bell"></i>
                <span class="badge-dot" id="bellDot"></span>
            </div>
            <div class="header-btn" onclick="openInfoModal('profile')"><i class="fa-solid fa-user-astronaut"></i></div>
        </div>
    </header>

    <div class="container">

        <!-- SÜRPRİZ MOD ÇARKI BANNERI -->
        <div class="random-banner" onclick="pickRandomMod()">
            <div>
                <div style="font-size: 15px; font-weight: 900;"><i class="fa-solid fa-dice" style="color:var(--accent-primary);"></i> Ne Oynasam Diye Düşünme!</div>
                <div style="font-size: 12px; color: var(--text-muted); margin-top:2px;">Rastgele efsanevi bir Minecraft modu keşfet.</div>
            </div>
            <button class="random-btn"><i class="fa-solid fa-shuffle"></i> Sürpriz Mod</button>
        </div>

        <!-- ARAMA VE FİLTRELER -->
        <div class="controls-wrapper">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" id="searchInput" placeholder="Bedrock modlarında ara..." onkeyup="renderMods()">
            </div>
        </div>

        <div class="categories-filter">
            <button class="cat-btn active" onclick="setCategory('all', this)">Tüm Modlar</button>
            <button class="cat-btn" onclick="setCategory('World', this)"><i class="fa-solid fa-earth-americas"></i> Dünyalar</button>
            <button class="cat-btn" onclick="setCategory('Utility', this)"><i class="fa-solid fa-wrench"></i> Araçlar</button>
            <button class="cat-btn" onclick="setCategory('Survival', this)"><i class="fa-solid fa-campground"></i> Survival</button>
        </div>

        <!-- MOD LİSTESİ -->
        <div class="mod-grid" id="modContainer"></div>
    </div>

    <!-- MOD DETAY MODALI (SÜRÜM SEÇİM DESTEKLİ) -->
    <div class="modal-overlay" id="modModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="modal-header-info">
                <div class="modal-icon" id="modal-icon"></div>
                <div>
                    <div id="modal-badges" style="margin-bottom: 6px;"></div>
                    <div class="modal-title" id="modal-title">Mod Başlığı</div>
                    <div class="rating-box">
                        <div class="rating-stars" id="ratingStars">
                            <i class="fa-solid fa-star" onclick="rateMod(1)"></i>
                            <i class="fa-solid fa-star" onclick="rateMod(2)"></i>
                            <i class="fa-solid fa-star" onclick="rateMod(3)"></i>
                            <i class="fa-solid fa-star" onclick="rateMod(4)"></i>
                            <i class="fa-solid fa-star" onclick="rateMod(5)"></i>
                        </div>
                        <span style="font-size: 13px; color: var(--text-muted); font-weight: bold;" id="ratingScore">(5.0)</span>
                    </div>
                </div>
            </div>

            <!-- İSTEDİĞİN SÜRÜMÜ SEÇME ALANI -->
            <div class="version-selector-box">
                <div class="version-label">
                    <i class="fa-solid fa-code-branch" style="color:var(--accent-primary);"></i> Sürüm Uyumluluğu:
                </div>
                <select class="version-dropdown" id="versionSelect" onchange="changeVersion()">
                    <option value="v26.33+">v26.33+ (En Yeni)</option>
                    <option value="v1.21.60">v1.21.60 Bedrock</option>
                    <option value="v1.21.50">v1.21.50 Bedrock</option>
                    <option value="v1.20.80">v1.20.80 Klasik</option>
                </select>
            </div>
            
            <p style="color: #cbd5e1; font-size: 14px; line-height: 1.6; margin-bottom: 20px;" id="modal-desc"></p>
            
            <div style="display: flex; gap: 20px; border-top: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border); padding: 14px 0;">
                <div class="stat-item"><i class="fa-solid fa-download" style="color: var(--accent-primary);"></i> <span id="modal-dl">0</span> İndirme</div>
                <div class="stat-item"><i class="fa-solid fa-heart" style="color: #ff4757;"></i> <span id="modal-likes">0</span> Beğeni</div>
            </div>

            <div class="modal-actions">
                <a class="btn-download-direct" id="modal-download-btn" href="#" download>
                    <i class="fa-solid fa-cloud-arrow-down"></i> Modu İndir (.mcaddon)
                </a>
                <button class="btn-action-icon" id="modal-like-btn"><i class="fa-solid fa-heart"></i></button>
                <button class="btn-action-icon" id="modal-save-btn"><i class="fa-solid fa-bookmark"></i></button>
            </div>
        </div>
    </div>

    <!-- BİLDİRİM & REHBER MODALI -->
    <div class="modal-overlay" id="infoModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
            <div id="infoModalBody"></div>
        </div>
    </div>

     <!-- ALT NAVİGASYON -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i> Keşfet</div>
        <div class="nav-item" onclick="switchTab('saved', this)"><i class="fa-solid fa-bookmark"></i> Kaydedilenler</div>
        <div class="nav-item" onclick="openInfoModal('profile', this)"><i class="fa-solid fa-user-astronaut"></i> Profil</div>
    </nav>

    <script>
        const modsData = [
            { id: 'mod1', title: 'Rustic Furniture', category: 'World', desc: 'Evlerinizi süsleyecek detaylı mobilya ve dekorasyon eklentisi. Odalarınızı baştan yaratın.', downloads: 0, likes: 0, icon: 'fa-couch', bg: 'linear-gradient(135deg, #ff6b81, #ff4757)', fileUrl: 'Rustic Furnture.mcaddon' },
            { id: 'mod2', title: 'Real Ragdoll', category: 'Utility', desc: 'Canlıların düşme ve ölme hareketlerine gerçekçi fizik katar. Oyun deneyimini tamamen değiştirir.', downloads: 0, likes: 0, icon: 'fa-person-falling', bg: 'linear-gradient(135deg, #70a1ff, #1e90ff)', fileUrl: 'RealRagdoll-1.3.0.mcaddon' },
            { id: 'mod3', title: 'System Dynamic Lights', category: 'Utility', desc: 'Elinizde tuttuğunuz meşaleler etrafı otomatik olarak aydınlatır. Madenlerde harika çalışır.', downloads: 0, likes: 0, icon: 'fa-lightbulb', bg: 'linear-gradient(135deg, #7bed9f, #2ed573)', fileUrl: 'System Dynamic Lights V3.3.mcpack' },
            { id: 'mod4', title: 'Vein Miner Addon', category: 'Utility', desc: 'Maden bloklarını tek tıkla topluca kırmanızı sağlayan inanılmaz pratik bir mod.', downloads: 0, likes: 0, icon: 'fa-hammer', bg: 'linear-gradient(135deg, #a4b0be, #747d8c)', fileUrl: 'Utilities_Vein_Miner_v5.5.mcaddon' },
            { id: 'mod5', title: 'Item Physics', category: 'Survival', desc: 'Yere düşen eşyaların 3D gerçekçi şekilde yatmasını sağlar. Yerde dönen eşyalara son!', downloads: 0, likes: 0, icon: 'fa-cubes', bg: 'linear-gradient(135deg, #eccc68, #ffa502)', fileUrl: 'Item Physics [V2.9] Behavior.mcpack' },
            { id: 'mod6', title: 'Better Trees', category: 'World', desc: 'Ağaç modellerini, kütükleri ve yaprak detaylarını çok daha doğal ve gerçekçi yapar.', downloads: 0, likes: 0, icon: 'fa-tree', bg: 'linear-gradient(135deg, #2ed573, #2f3542)', fileUrl: 'Better Trees by Daniye - v1.4.mcpack' }
        ];

        let currentCategory = 'all';
        let currentTab = 'home';
        let activeModId = null;

        window.onload = () => { renderMods(); checkNotificationStatus(); };

        // DOKUNMATİK TİTREŞİM DESTEĞİ
        function vibrate() { if (navigator.vibrate) navigator.vibrate(25); }

        function checkNotificationStatus() {
            if(localStorage.getItem('notificationsRead') === 'true') {
                document.getElementById('bellDot').style.display = 'none';
            }
        }

        function showToast(message, type = 'success') {
            vibrate();
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'success' ? 'fa-circle-check' : 'fa-bell';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function setCategory(cat, btnElement) {
            vibrate(); currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active'); renderMods();
        }

        function switchTab(tab, btnElement) {
            vibrate(); currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active'); renderMods();
        }

        function renderMods() {
            const container = document.getElementById('modContainer');
            container.innerHTML = '';
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = modsData.filter(mod => {
                const matchCat = currentCategory === 'all' || mod.category === currentCategory;
                const matchSearch = mod.title.toLowerCase().includes(search);
                const isSaved = localStorage.getItem(mod.id + '_saved') === 'true';
                if(currentTab === 'saved') return isSaved && matchSearch;
                return matchCat && matchSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted); grid-column: 1/-1;"><i class="fa-solid fa-ghost" style="font-size:32px; margin-bottom:10px; display:block;"></i> Mod bulunamadı.</div>`;
                return;
            }

            filtered.forEach((mod, index) => {
                let dlCount = localStorage.getItem(mod.id + '_dl_count') || mod.downloads;
                let likeCount = localStorage.getItem(mod.id + '_likes') || mod.likes;
                let delay = index * 0.08;
                
                container.innerHTML += `
                    <div class="mod-card" style="animation-delay: ${delay}s" onclick="openModal('${mod.id}')">
                        <div class="card-header">
                            <div class="mod-img" style="background: ${mod.bg};"><i class="fa-solid ${mod.icon}"></i></div>
                            <div style="display: flex; flex-direction: column; justify-content: center;">
                                <div class="mod-title">${mod.title}</div>
                                <span class="badge">${mod.category}</span>
                            </div>
                        </div>
                        <div class="mod-desc">${mod.desc}</div>
                        <div class="mod-footer">
                            <div style="display:flex; gap:16px;">
                                <span class="stat-item"><i class="fa-solid fa-download"></i> ${dlCount}</span>
                                <span class="stat-item"><i class="fa-solid fa-heart"></i> ${likeCount}</span>
                            </div>
                            <button class="btn-view">İncele</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(id) {
            vibrate(); activeModId = id;
            const mod = modsData.find(m => m.id === id);
            
            let dlCount = localStorage.getItem(mod.id + '_dl_count') || mod.downloads;
            let likeCount = localStorage.getItem(mod.id + '_likes') || mod.likes;
            let isLiked = localStorage.getItem(mod.id + '_liked') === 'true';
            let isSaved = localStorage.getItem(mod.id + '_saved') === 'true';

            document.getElementById('modal-icon').style.background = mod.bg;
            document.getElementById('modal-icon').innerHTML = `<i class="fa-solid ${mod.icon}" style="color:#fff;"></i>`;
            document.getElementById('modal-badges').innerHTML = `<span class="badge">${mod.category}</span>`;
            document.getElementById('modal-title').innerText = mod.title;
            document.getElementById('modal-desc').innerText = mod.desc;
            
            document.getElementById('modal-dl').innerText = dlCount;
            document.getElementById('modal-likes').innerText = likeCount;

            const dlBtn = document.getElementById('modal-download-btn');
            dlBtn.href = mod.fileUrl;
            dlBtn.onclick = () => { incrementDownloadCount(mod.title); };

            const likeBtn = document.getElementById('modal-like-btn');
            const saveBtn = document.getElementById('modal-save-btn');
            likeBtn.className = `btn-action-icon ${isLiked ? 'liked' : ''}`;
            saveBtn.className = `btn-action-icon ${isSaved ? 'saved' : ''}`;

            likeBtn.onclick = () => toggleAction('like', mod.title);
            saveBtn.onclick = () => toggleAction('save', mod.title);

            document.getElementById('modModal').classList.add('active');
        }

        function changeVersion() {
            const ver = document.getElementById('versionSelect').value;
            showToast(`Seçilen Sürüm: ${ver} uyumlu paket ayarlandı.`, 'success');
        }

        function rateMod(stars) {
            vibrate();
            showToast(`Bu moda ${stars} Yıldız verdiniz!`, 'success');
            document.getElementById('ratingScore').innerText = `(${stars}.0)`;
        }

        function pickRandomMod() {
            vibrate();
            const randomIndex = Math.floor(Math.random() * modsData.length);
            openModal(modsData[randomIndex].id);
            showToast('🎉 Senin için rastgele bir mod seçildi!', 'success');
        }

        function openHelpModal() {
            vibrate();
            const body = document.getElementById('infoModalBody');
            body.innerHTML = `
                <h3 style="margin-bottom:15px; font-weight:900;"><i class="fa-solid fa-circle-question" style="color:var(--accent-primary);"></i> Hata & Kurulum Rehberi</h3>
                <div style="background:var(--card-bg); padding:16px; border-radius:16px; border:1px solid var(--card-border); margin-bottom:12px;">
                    <div style="font-weight:bold; color:var(--warning); margin-bottom:4px;">⚠️ "Kopya Paket Saptandı" Nedir?</div>
                    <div style="font-size:13px; color:var(--text-muted); line-height:1.5;">Bu bir hata değildir! Modun cihazınızda ve Minecraft'ınızda zaten yüklü olduğunu gösterir. Başarıyla çalışmaktadır.</div>
                </div>
            `;
            document.getElementById('infoModal').classList.add('active');
        }

        function incrementDownloadCount(modTitle) {
            let currentDl = parseInt(localStorage.getItem(activeModId + '_dl_count') || 0);
            currentDl++;
            localStorage.setItem(activeModId + '_dl_count', currentDl);
            document.getElementById('modal-dl').innerText = currentDl;
            showToast(`${modTitle} indirmesi başlatıldı!`, 'success');
            renderMods();
        }

        function toggleAction(type, modTitle) {
            vibrate();
            let key = activeModId + (type === 'like' ? '_liked' : '_saved');
            let currentState = localStorage.getItem(key) === 'true';
            localStorage.setItem(key, !currentState);

            if(type === 'like') {
                let currentLikes = parseInt(localStorage.getItem(activeModId + '_likes') || 0);
                let newLikes = currentState ? currentLikes - 1 : currentLikes + 1;
                localStorage.setItem(activeModId + '_likes', newLikes);
                document.getElementById('modal-likes').innerText = newLikes;
                document.getElementById('modal-like-btn').classList.toggle('liked');
            } else {
                document.getElementById('modal-save-btn').classList.toggle('saved');
            }
            renderMods();
        }

        function openInfoModal(type) {
            vibrate();
            const body = document.getElementById('infoModalBody');
            if (type === 'notifications') {
                localStorage.setItem('notificationsRead', 'true');
                document.getElementById('bellDot').style.display = 'none';
                body.innerHTML = `
                    <h3 style="margin-bottom:15px; font-weight:900;"><i class="fa-solid fa-bell" style="color:var(--accent-primary);"></i> Bildirimler</h3>
                    <div style="background:var(--card-bg); padding:14px; border-radius:14px; border:1px solid var(--card-border);">
                        <div style="font-weight:bold; margin-bottom:4px;">🔥 Sürüm Seçici Aktif!</div>
                        <div style="font-size:13px; color:var(--text-muted);">Artık mod detay penceresinden v26.33+ veya istediğiniz Minecraft sürümünü seçebilirsiniz.</div>
                    </div>
                `;
            } else if (type === 'profile') {
                body.innerHTML = `
                    <div style="text-align:center; padding:15px 0;">
                        <div style="width:80px; height:80px; background:var(--accent-primary); border-radius:24px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow:0 10px 20px var(--accent-glow);"><i class="fa-solid fa-user-ninja"></i></div>
                        <h3 style="font-size:22px; font-weight:900;">Bedrock Pro</h3>
                        <p style="font-size:13px; color:var(--accent-primary); font-weight:bold; margin-top:4px;">Kurucu / Mod Geliştirici</p>
                    </div>
                `;
            }
            document.getElementById('infoModal').classList.add('active');
        }

        function closeAllModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }
        function closeModal(e) { if (e.target.classList.contains('modal-overlay')) closeAllModals(); }
    </script>
</body>
</html>
